name: Update charts

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download charts
        run: python fetch_charts.py
      - name: Save changes
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "Update charts"
          git push
