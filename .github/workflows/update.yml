name: Update charts

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download charts
        run: python fetch_charts.py
      - name: Save changes
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update charts"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
